
services:

  postgres:
    image: postgres:16
    container_name: falcon-postgres
    restart: unless-stopped

    command:
      - "postgres"
      - "-c"
      - "wal_level=logical"
      - "-c"
      - "max_wal_senders=10"
      - "-c"
      - "max_replication_slots=10"

    environment:
      POSTGRES_DB: falcon
      POSTGRES_USER: falcon
      POSTGRES_PASSWORD: falcon

    ports:
      - "5432:5432"

    volumes:
      - falcon_postgres_data:/var/lib/postgresql/data

    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U falcon -d falcon"]
      interval: 5s
      timeout: 5s
      retries: 10


  zookeeper:
    image: confluentinc/cp-zookeeper:7.7.7
    container_name: falcon-zookeeper
    restart: unless-stopped

    environment:
      ZOOKEEPER_CLIENT_PORT: 2181
      ZOOKEEPER_TICK_TIME: 2000

    ports:
      - "2181:2181"

    volumes:
      - zookeeper_data:/var/lib/zookeeper/data
      - zookeeper_logs:/var/lib/zookeeper/log


  kafka:
    image: confluentinc/cp-kafka:7.7.7
    container_name: falcon-kafka
    restart: unless-stopped

    depends_on:
      zookeeper:
        condition: service_started

    ports:
      - "9092:9092"
      - "29092:29092"

    environment:
      KAFKA_BROKER_ID: 1
      KAFKA_ZOOKEEPER_CONNECT: zookeeper:2181
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: "PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT"
      KAFKA_ADVERTISED_LISTENERS: "PLAINTEXT://kafka:29092,PLAINTEXT_HOST://localhost:9092"
      KAFKA_LISTENERS: "PLAINTEXT://0.0.0.0:29092,PLAINTEXT_HOST://0.0.0.0:9092"
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "false"
      KAFKA_LOG_RETENTION_HOURS: 168

    volumes:
      - kafka_data:/var/lib/kafka/data

  rustfs:
    image: rustfs/rustfs:latest
    container_name: falcon-rustfs
    restart: unless-stopped

    command: ["/data"]

    environment:
      RUSTFS_ACCESS_KEY: ${RUSTFS_ACCESS_KEY}
      RUSTFS_SECRET_KEY: ${RUSTFS_SECRET_KEY}
      RUSTFS_ADDRESS: ":9000"
      RUSTFS_CONSOLE_ADDRESS: ":9001"
      RUSTFS_CONSOLE_ENABLE: "true"

    ports:
      - "9000:9000"
      - "9001:9001"

    volumes:
      - rustfs_data:/data


  spark:
    profiles:
      - spark
    build:
      context: ./spark
      dockerfile: Dockerfile
    image: falcon-spark:4.1.4
    container_name: falcon-spark
    mem_limit: 1536m
    entrypoint: ["/opt/spark/bin/spark-submit"]

    environment:
      KAFKA_BOOTSTRAP_SERVERS: kafka:29092
      RUSTFS_ENDPOINT: http://rustfs:9000
      RUSTFS_ACCESS_KEY: ${RUSTFS_ACCESS_KEY}
      RUSTFS_SECRET_KEY: ${RUSTFS_SECRET_KEY}

    volumes:
      - ./spark/apps:/opt/falcon/spark/apps
      - falcon_spark_ivy_cache:/tmp/ivy-cache



volumes:

  falcon_postgres_data:
    external: true
    name: falcon-data-platform_falcon_postgres_data

  kafka_data:
    external: true
    name: f09702aee653eee145c19684b6e2e65afaa5faac5f951008a856171b4dc0ff50

  zookeeper_data:
    external: true
    name: da7ea3d2bfccbe0836f01fac7a83b05b61f108a6b02167ee1f03ae9e344c41b5

  zookeeper_logs:
    external: true
    name: 5fb1487410ce652c4e13241e90dae07edee0f981e31f10f5a54992957ed594de

  rustfs_data:
    name: falcon_rustfs_data

  falcon_spark_ivy_cache:
    external: true
    name: falcon_spark_ivy_cache
